name: catsos

services:
  backend:
    build:
      context: ./backend
      target: development
    env_file:
      - ./.env
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: local-docker-development-secret-key-32-bytes
      DJANGO_ALLOWED_HOSTS: localhost,backend
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5173
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      VITE_MICROSOFT_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      VITE_MICROSOFT_TENANT_ID: common
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend-node-modules:
